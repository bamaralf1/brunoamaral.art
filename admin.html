  function openPalette() {
    var root = $('#modalRoot');
    root.innerHTML =
      '<div class="cmdk-overlay" data-cmdk-overlay>' +
        '<div class="cmdk" role="dialog" aria-modal="true" aria-label="Busca rápida">' +
          '<input id="cmdkInput" placeholder="Buscar obras, ações…" autocomplete="off" spellcheck="false">' +
          '<div class="cmdk-list" id="cmdkList"></div>' +
        '</div>' +
      '</div>';
    var input = $('#cmdkInput');
    var list = $('#cmdkList');
    var idx = 0;
    var items = [];

    function itemHtml(label, hint, img) {
      return '<div class="cmdk-item">' +
        (img ? '<span class="thumb-mini" style="background-image:url(\'' + esc(img) + '\')"></span>' : '') +
        '<span>' + esc(label) + '</span>' +
        (hint ? '<span class="k">' + esc(hint) + '</span>' : '') +
      '</div>';
    }
    function renderList() {
      var q = input.value.trim().toLowerCase();
      var cmds = paletteCommands().filter(function (c) { return c.label.toLowerCase().indexOf(q) >= 0; });
      var obras = S.data.obras.filter(function (o) {
        return [o.titulo, o.categoria, o.ano, o.tecnica].join(' ').toLowerCase().indexOf(q) >= 0;
      }).slice(0, 6);
      items = [];
      var html = '';
      if (cmds.length) {
        html += '<div class="cmdk-group">Ações</div>';
        cmds.forEach(function (c) { items.push(c); html += itemHtml(c.label, c.k); });
      }
      if (obras.length) {
        html += '<div class="cmdk-group">Obras</div>';
        obras.forEach(function (o) {
          items.push({ label: o.titulo, run: function () { go('obras'); setTimeout(function () { openObra(o.id); }, 60); } });
          html += itemHtml(o.titulo, o.categoria, o.img);
        });
      }
      if (!items.length) html = '<div class="cmdk-empty">Nada encontrado.</div>';
      list.innerHTML = html;
      idx = 0;
      highlight();
    }
    function highlight() {
      $$('.cmdk-item', list).forEach(function (el, i) { el.classList.toggle('active', i === idx); });
      var act = $('.cmdk-item.active', list);
      if (act) act.scrollIntoView({ block: 'nearest' });
    }
    function run(i) {
      var it = items[i];
      if (!it) return;
      close();
      try { setTimeout(function () { it.run(); }, 20); } catch (e) { toast(e.message, 'err'); }
    }
    function close() { root.innerHTML = ''; }

    input.addEventListener('input', renderList);
    input.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown') { e.preventDefault(); idx = Math.min(idx + 1, items.length - 1); highlight(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); idx = Math.max(idx - 1, 0); highlight(); }
      else if (e.key === 'Enter') { e.preventDefault(); run(idx); }
      else if (e.key === 'Escape') { e.preventDefault(); close(); }
    });
    list.addEventListener('click', function (e) {
      var el = e.target.closest('.cmdk-item');
      if (!el) return;
      run($$('.cmdk-item', list).indexOf(el));
    });
    $('[data-cmdk-overlay]').addEventListener('mousedown', function (e) { if (e.target === this) close(); });
    renderList();
    input.focus();
  }

  // ------------------------------------------------------------------ pesquisa
  var CAMPOS = {
    nps: 'Recomendação (NPS)', satisfacao_geral: 'Satisfação geral', clareza_comunicacao: 'Clareza da comunicação',
    valor_percebido: 'Valor percebido', servico_transportadora: 'Serviço da transportadora',
    descoberta: 'Como descobriu o atelier', descoberta_outro: 'Descoberta — outro', tempo_conhecimento: 'Tempo de conhecimento',
    primeira_impressao: 'Primeira impressão', primeira_impressao_outro: 'Primeira impressão — outro',
    tipo_obra: 'Tipo de aquisição', fricao: 'Obstáculos', fricao_outro: 'Obstáculos — outro',
    acompanhamento_processo: 'Acompanhamento do processo', fidelidade_imagem: 'Fidelidade da imagem',
    fidelidade_imagem_detalhe: 'Fidelidade — detalhe', qualidade_execucao: 'Qualidade da execução',
    acabamento: 'Acabamento', acabamento_detalhe: 'Acabamento — detalhe', acabamento_falta: 'Acabamento em falta',
    reacao_emocional: 'Reação emocional', detalhe_marcante: 'Detalhe marcante',
    prazo_envio: 'Prazo de envio', prazo_envio_motivo: 'Prazo — motivo', embalagem: 'Embalagem',
    embalagem_melhorar: 'Embalagem — a melhorar', estado_fisico: 'Estado na chegada', estado_fisico_descricao: 'Estado — descrição',
    certificado: 'Certificado', recompra: 'Intenção de recompra', interesse_futuro: 'Interesses futuros',
    sugestao: 'Sugestão', testemunho: 'Testemunho', permissao_testemunho: 'Permissão do testemunho',
    novidades: 'Novidades', contato: 'Contato', obra: 'Obra', _obra_titulo: 'Obra (convite)'
  };

  function numero(v) {
    if (v === null || v === undefined || v === '') return null;
    var n = parseFloat(String(v).replace(',', '.'));
    return isNaN(n) ? null : n;
  }
  function media(lista) {
    var vals = lista.filter(function (v) { return v !== null && v !== undefined && !isNaN(v); });
    if (!vals.length) return null;
    return vals.reduce(function (a, b) { return a + b; }, 0) / vals.length;
  }
  function fmt1(v) { return v === null || v === undefined ? '—' : v.toFixed(1).replace('.', ','); }
  function pct(parte, total) { return total ? Math.round(parte / total * 100) : 0; }
  function notaClasse(v) { return v === null ? '' : v >= 9 ? 'pro' : v >= 7 ? 'pas' : 'det'; }
  function notaNome(v) { return v === null ? 'Sem nota' : v >= 9 ? 'Promotor' : v >= 7 ? 'Neutro' : 'Detrator'; }
  function qualNota(v) {
    var mapa = { 'Excepcional': 5, 'Muito boa': 4, 'Boa': 3.5, 'Razoável': 2.5, 'Abaixo das expectativas': 1 };
    return mapa[String(v || '').trim()] || null;
  }
  function contarCampo(itens, campo) {
    var mapa = {};
    itens.forEach(function (r) {
      [].concat(r[campo] || []).forEach(function (v) {
        var t = String(v || '').trim();
        if (t) mapa[t] = (mapa[t] || 0) + 1;
      });
    });
    return mapa;
  }
  function topo(mapa) {
    var melhor = null;
    Object.keys(mapa).forEach(function (k) { if (!melhor || mapa[k] > mapa[melhor]) melhor = k; });
    return melhor ? { label: melhor, n: mapa[melhor] } : null;
  }
  function dataCurta(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d)) return '';
    return d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short', year: 'numeric' });
  }
  function dataHora(ts) {
    if (!ts) return '';
    return new Date(ts).toLocaleString('pt-BR', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
  }
  function nomeCliente(r) {
    var c = String(r.contato || '').trim();
    if (!c) return 'Colecionador';
    return c.split(/[·|]/)[0].trim() || c;
  }
  function obraCliente(r) {
    return String(r.obra || r._obra_titulo || '').trim() || 'Obra não indicada';
  }
  function nomeObra(id) {
    var o = S.data.obras.find(function (x) { return x.id === id; });
    return o ? (o.titulo || 'Sem título') : '';
  }

  function calcPesquisa(itens) {
    var comNps = itens.filter(function (r) { return numero(r.nps) !== null; });
    var pro = 0, pas = 0, det = 0;
    comNps.forEach(function (r) {
      var n = numero(r.nps);
      if (n >= 9) pro++; else if (n >= 7) pas++; else det++;
    });
    var nps = comNps.length ? Math.round((pro - det) / comNps.length * 100) : null;

    var sat = media(itens.map(function (r) { return numero(r.satisfacao_geral); }));
    var com = media(itens.map(function (r) { return numero(r.clareza_comunicacao); }));
    var valor = media(itens.map(function (r) { return numero(r.valor_percebido); }));
    var transp = media(itens.map(function (r) { return numero(r.servico_transportadora); }));
    var qual = media(itens.map(function (r) { return qualNota(r.qualidade_execucao); }));

    var partes = [
      { v: nps === null ? null : (nps + 100) / 2, w: .30 },
      { v: sat === null ? null : (sat / 5) * 100, w: .25 },
      { v: qual === null ? null : (qual / 5) * 100, w: .20 },
      { v: com === null ? null : (com / 5) * 100, w: .15 },
      { v: transp === null ? null : (transp / 5) * 100, w: .10 }
    ];
    var peso = 0, soma = 0;
    partes.forEach(function (p) { if (p.v !== null) { peso += p.w; soma += p.v * p.w; } });
    var indice = peso ? Math.round(soma / peso) : null;

    var comTexto = itens.filter(function (r) { return String(r.testemunho || '').trim(); });
    var comSugestao = itens.filter(function (r) { return String(r.sugestao || '').trim(); });
    var autorizados = itens.filter(function (r) { return /^sim/i.test(String(r.permissao_testemunho || '')); });

    return {
      n: itens.length, pro: pro, pas: pas, det: det, comNps: comNps.length, nps: nps,
      sat: sat, com: com, valor: valor, transp: transp, qual: qual, indice: indice,
      testemunhos: comTexto.length, sugestoes: comSugestao.length, autorizados: autorizados.length,
      fricao: topo(contarCampo(itens, 'fricao')),
      interesse: topo(contarCampo(itens, 'interesse_futuro')),
      ultima: itens.slice().sort(function (a, b) {
        return String(b.recebidoEm || b._enviado_em || '').localeCompare(String(a.recebidoEm || a._enviado_em || ''));
      })[0] || null
    };
  }

  function npsRotulo(v) {
    if (v === null) return 'Sem respostas';
    if (v >= 75) return 'Excelente';
    if (v >= 50) return 'Forte';
    if (v >= 0) return 'Em construção';
    return 'Crítico';
  }

  function npsChart(itens) {
    var contagem = [];
    for (var i = 0; i <= 10; i++) contagem.push(0);
    itens.forEach(function (r) {
      var n = numero(r.nps);
      if (n !== null && n >= 0 && n <= 10) contagem[Math.round(n)]++;
    });
    var max = Math.max.apply(null, contagem.concat([1]));
    return '<div class="nps-chart" role="img" aria-label="Distribuição das notas de recomendação">' +
      contagem.map(function (c, nota) {
        var cls = nota >= 9 ? 'pro' : nota >= 7 ? 'pas' : 'det';
        var alt = Math.max(c ? 4 : 0, Math.round(c / max * 100));
        return '<div class="nps-col ' + cls + '" title="' + c + ' resposta(s) com nota ' + nota + '">' +
          '<span class="n">' + (c || '') + '</span>' +
          '<div class="nps-track"><i style="height:' + alt + '%"></i></div>' +
          '<span class="l">' + nota + '</span>' +
        '</div>';
      }).join('') +
    '</div>';
  }

  function barraPesquisa(label, valor, max, display) {
    var largura = valor === null ? 0 : Math.max(3, Math.round(valor / max * 100));
    return '<div class="bar-row"><span>' + esc(label) + '</span><div class="bar"><span style="width:' + largura + '%"></span></div><span class="n">' + esc(display) + '</span></div>';
  }

  function respostasFiltradas() {
    var q = S.pesq.q.trim().toLowerCase();
    if (!q) return S.pesq.itens;
    return S.pesq.itens.filter(function (r) {
      return [r.contato, r.obra, r._obra_titulo, r.sugestao, r.testemunho, r.detalhe_marcante, r.nps]
        .join(' ').toLowerCase().indexOf(q) >= 0;
    });
  }

  function respostaCard(r, i) {
    var id = String(r.id || (r._arquivo ? r._arquivo.replace(/^pesquisas\//, '').replace(/\.json$/, '') : ''));
    var nps = numero(r.nps);
    var cls = notaClasse(nps);
    var aberto = S.pesq.open[id] ? ' open' : '';
    var data = r.recebidoEm || r._enviado_em;
    var extras = Object.keys(r).filter(function (k) {
      return k.indexOf('_') !== 0 && ['id', 'recebidoEm', 'botcheck', 'fotos'].indexOf(k) < 0 && r[k] !== '' && r[k] !== null && r[k] !== undefined;
    });

    var linhas = [];
    function linha(label, valor) {
      if (valor === undefined || valor === null || String(valor).trim() === '') return;
      linhas.push('<div class="resp-row"><span>' + esc(label) + '</span><span>' + esc(valor) + '</span></div>');
    }
    linha('Satisfação', numero(r.satisfacao_geral) !== null ? fmt1(numero(r.satisfacao_geral)) + ' / 5' : '');
    linha('Comunicação', numero(r.clareza_comunicacao) !== null ? fmt1(numero(r.clareza_comunicacao)) + ' / 5' : '');
    linha('Valor percebido', numero(r.valor_percebido) !== null ? fmt1(numero(r.valor_percebido)) + ' / 5' : '');
    linha('Execução', r.qualidade_execucao);
    linha('Acompanhamento', r.acompanhamento_processo);
    linha('Fidelidade da imagem', r.fidelidade_imagem);
    linha('Acabamento', r.acabamento);
    linha('Prazo', r.prazo_envio);
    linha('Embalagem', r.embalagem);
    linha('Estado na chegada', r.estado_fisico);
    linha('Transportadora', numero(r.servico_transportadora) !== null ? fmt1(numero(r.servico_transportadora)) + ' / 5' : '');
    linha('Certificado', r.certificado);
    linha('Recompra', r.recompra);
    linha('Interesses', [].concat(r.interesse_futuro || []).join(', '));
    linha('Permissão do testemunho', r.permissao_testemunho);

    var citacoes = '';
    [['Sugestão', r.sugestao], ['Testemunho', r.testemunho], ['Detalhe marcante', r.detalhe_marcante]].forEach(function (par) {
      var txt = String(par[1] || '').trim();
      if (txt) citacoes += '<div class="resp-row" style="border-bottom:0;padding-top:.9rem"><span>' + esc(par[0]) + '</span><span></span></div><p class="resp-quote">' + esc(txt) + '</p>';
    });

    /* primeira frase do comentário, para se perceber a resposta sem abrir */
    var resumo = '';
    [r.testemunho, r.detalhe_marcante, r.sugestao].some(function (v) {
      var t = String(v || '').replace(/\s+/g, ' ').trim();
      if (t) { resumo = t.length > 128 ? t.slice(0, 126).replace(/[,;:\s]+\S*$/, '') + '…' : t; return true; }
      return false;
    });

    var todos = extras.map(function (k) {
      var v = r[k];
      if (Array.isArray(v)) v = v.join(', ');
      return '<div class="resp-row"><span>' + esc(CAMPOS[k] || k.replace(/_/g, ' ')) + '</span><span>' + esc(v) + '</span></div>';
    }).join('');

    return '<article class="resp' + aberto + '" data-id="' + esc(id) + '">' +
      '<div class="resp-head" data-resp-toggle="' + esc(id) + '" role="button" tabindex="0" aria-expanded="' + (aberto ? 'true' : 'false') + '">' +
        '<span class="resp-score ' + cls + '">' + (nps === null ? '—' : nps) + '</span>' +
        '<span class="resp-id">' +
          '<span class="resp-name">' + esc(nomeCliente(r)) + '</span>' +
          '<span class="resp-meta">' + esc(obraCliente(r)) + (data ? ' · ' + esc(dataCurta(data)) : '') + '</span>' +
          (resumo ? '<span class="resp-excerpt">“' + esc(resumo) + '”</span>' : '') +
        '</span>' +
        '<span class="pill ' + cls + '">' + esc(notaNome(nps)) + '</span>' +
        '<span class="resp-chev" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M4 6l4 4 4-4"/></svg></span>' +
      '</div>' +
      '<div class="resp-body">' +
        (linhas.length ? '<div class="resp-grid">' + linhas.join('') + '</div>' : '') +
        citacoes +
        (todos ? '<details class="resp-all"><summary>Todos os campos</summary><div class="resp-grid">' + todos + '</div></details>' : '') +
        '<div class="resp-foot">' +
          '<span class="pesq-note">Recebida em ' + esc(dataCurta(data) || 'data desconhecida') + '</span>' +
          '<span class="spacer"></span>' +
          '<button class="btn sm danger" data-resp-del="' + esc(id) + '">Remover resposta</button>' +
        '</div>' +
      '</div>' +
    '</article>';
  }

  function respostasHtml(lista) {
    if (!S.pesq.itens.length) {
      return '<div class="empty"><strong>Ainda sem respostas</strong>Envie o primeiro convite a um colecionador na secção abaixo. As respostas aparecem aqui assim que forem enviadas.</div>';
    }
    if (!lista.length) return '<div class="empty"><strong>Nada encontrado</strong>Ajuste a busca por nome, obra ou palavra-chave.</div>';
    return lista.map(respostaCard).join('');
  }

  function renderRespList() {
    var box = $('#respList');
    if (!box) return;
    var lista = respostasFiltradas();
    box.innerHTML = respostasHtml(lista);
    var count = $('#pesqCount');
    if (count) count.textContent = lista.length === S.pesq.itens.length ? String(S.pesq.itens.length) : lista.length + ' / ' + S.pesq.itens.length;
  }

  function viewPesquisa() {
    var p = S.pesq;

    if (p.status === 'idle' || p.status === 'loading') {
      return '<div class="card"><div class="pesq-loading">A carregar as respostas do atelier…</div></div>';
    }
    if (p.status === 'auth') {
      return '<div class="card">' +
        '<h2>Respostas protegidas <span class="line"></span></h2>' +
        '<p class="sub">As respostas dos colecionadores são confidenciais. Informe a senha do painel para as consultar.</p>' +
        '<button class="btn gold" data-pesq-auth>Entrar e ver respostas</button>' +
        '<p class="hint">A senha fica guardada apenas nesta sessão do navegador.</p>' +
      '</div>';
    }
    if (p.status === 'error') {
      return '<div class="card">' +
        '<h2>Respostas indisponíveis <span class="line"></span></h2>' +
        '<p class="sub">' + esc(p.erro || 'Não foi possível contactar o servidor.') + '</p>' +
        '<div class="toolbar" style="margin:0"><button class="btn gold" data-pesq-refresh>Tentar novamente</button></div>' +
        '<p class="hint">No ambiente local, a API de respostas só funciona na versão publicada.</p>' +
      '</div>';
    }

    var itens = p.itens || [];
    var s = calcPesquisa(itens);
    var semDados = !itens.length;

    return '' +
      '<div class="toolbar">' +
        '<div class="search"><input type="text" id="pesqQ" aria-label="Buscar respostas" placeholder="Buscar por cliente, obra ou comentário…" value="' + esc(p.q) + '"></div>' +
        (p.atualizado ? '<span class="pesq-note">Atualizado ' + esc(dataHora(p.atualizado)) + '</span>' : '') +
        '<button class="btn" data-pesq-refresh>Atualizar</button>' +
      '</div>' +
      '<div class="stats">' +
        stat('Respostas', s.n, s.ultima ? 'última em ' + dataCurta(s.ultima.recebidoEm || s.ultima._enviado_em) : 'convide um colecionador') +
        '<div class="stat"><div class="k">NPS</div><div class="v">' + (s.nps === null ? '—' : s.nps) + '</div><div class="m">' + esc(npsRotulo(s.nps)) + '</div></div>' +
        stat('Satisfação', s.sat === null ? '—' : fmt1(s.sat) + ' / 5', 'média geral') +
        '<div class="stat gold"><div class="k">Índice de solidez</div><div class="v">' + (s.indice === null ? '—' : s.indice) + '</div><div class="m">lealdade, obra e entrega</div></div>' +
      '</div>' +

      (semDados ? '' :
      '<div class="grid2">' +
        '<div class="card">' +
          '<h2>Distribuição das notas <span class="line"></span></h2>' +
          npsChart(itens) +
          '<div class="nps-legend">' +
            '<span><i class="legend-dot pro"></i><b>' + s.pro + '</b> promotores</span>' +
            '<span><i class="legend-dot pas"></i><b>' + s.pas + '</b> neutros</span>' +
            '<span><i class="legend-dot det"></i><b>' + s.det + '</b> detratores</span>' +
          '</div>' +
          '<p class="hint">NPS = promotores − detratores. Acima de 50 é forte; 75 é excelência. Detratores pedem uma conversa pessoal, não um formulário.</p>' +
        '</div>' +
        '<div class="card">' +
          '<h2>Médias por dimensão <span class="line"></span></h2>' +
          '<div class="bars">' +
            barraPesquisa('Satisfação', s.sat, 5, s.sat === null ? '—' : fmt1(s.sat) + ' / 5') +
            barraPesquisa('Execução', s.qual, 5, s.qual === null ? '—' : fmt1(s.qual) + ' / 5') +
            barraPesquisa('Comunicação', s.com, 5, s.com === null ? '—' : fmt1(s.com) + ' / 5') +
            barraPesquisa('Valor percebido', s.valor, 5, s.valor === null ? '—' : fmt1(s.valor) + ' / 5') +
            barraPesquisa('Transportadora', s.transp, 5, s.transp === null ? '—' : fmt1(s.transp) + ' / 5') +
          '</div>' +
          '<div class="divider"></div>' +
          '<div class="row-between" style="font-size:.9rem;color:var(--ink-soft)"><span>Testemunhos autorizados</span><strong>' + s.autorizados + '</strong></div>' +
          '<div class="row-between" style="font-size:.9rem;color:var(--ink-soft);margin-top:.4rem"><span>Sugestões recebidas</span><strong>' + s.sugestoes + '</strong></div>' +
          (s.fricao ? '<div class="row-between" style="font-size:.9rem;color:var(--ink-soft);margin-top:.4rem"><span>Atrito mais citado</span><strong>' + esc(s.fricao.label) + '</strong></div>' : '') +
          (s.interesse ? '<div class="row-between" style="font-size:.9rem;color:var(--ink-soft);margin-top:.4rem"><span>Interesse futuro</span><strong>' + esc(s.interesse.label) + '</strong></div>' : '') +
        '</div>' +
      '</div>') +

      '<div class="card">' +
        '<h2>Respostas <span class="line"></span><span class="nav-count" id="pesqCount">' + (p.q ? respostasFiltradas().length + ' / ' + itens.length : itens.length) + '</span></h2>' +
        '<div id="respList" class="resp-list">' + respostasHtml(respostasFiltradas()) + '</div>' +
      '</div>' +

      convitesCard();
  }

  function convitesCard() {
    var convites = lerConvites();
    var vendidas = S.data.obras.filter(function (o) { return o.status === 'vendido'; });

    var lista = vendidas.length ? '<div class="invite-list">' + vendidas.map(function (o) {
      var c = convites[o.id];
      return '<div class="invite-row">' +
        (o.img ? '<img class="invite-thumb" src="' + esc(o.img) + '" alt="" loading="lazy">' : '') +
        '<div class="t"><b>' + esc(o.titulo || 'Sem título') + '</b><span>' +
          esc([o.categoria, o.ano].filter(Boolean).join(' · ') || 'Obra vendida') +
          (c ? ' · convite ' + esc(dataCurta(c.em)) : ' · ainda sem convite') +
        '</span></div>' +
        '<button class="btn sm gold" data-invite="' + esc(o.id) + '">Preparar convite</button>' +
      '</div>';
    }).join('') + '</div>' : '<div class="empty"><strong>Nenhuma obra marcada como vendida</strong>Marque a obra como vendida em Obras para a ver aqui — ou gere um convite para qualquer obra abaixo.</div>';

    return '<div class="card">' +
      '<h2>Enviar a pesquisa <span class="line"></span></h2>' +
      '<p class="sub">Cada convite abre a pesquisa já personalizada com o nome do colecionador e a obra. Escolha a obra vendida e envie por WhatsApp, e-mail ou copie o link.</p>' +
      lista +
      '<div class="divider"></div>' +
      '<div class="grid2">' +
        '<div class="field"><label class="f" for="inviteObraSel">Qualquer obra do acervo</label><select id="inviteObraSel">' +
          S.data.obras.map(function (o) {
            return '<option value="' + esc(o.id) + '">' + esc(o.titulo || 'Sem título') + (o.status === 'vendido' ? ' — vendida' : '') + '</option>';
          }).join('') +
        '</select></div>' +
        '<div class="field" style="display:flex;align-items:flex-end"><button class="btn gold block" data-invite-any>Preparar convite</button></div>' +
      '</div>' +
      '<p class="hint">O link não expira. As respostas ficam guardadas no atelier e aparecem nesta página.</p>' +
    '</div>';
  }

  function lerConvites() {
    try { return JSON.parse(localStorage.getItem(CONVITES_KEY) || '{}') || {}; } catch (e) { return {}; }
  }
  function marcarConvite(obraId, nome) {
    var c = lerConvites();
    c[obraId] = { nome: nome || '', em: new Date().toISOString() };
    try { localStorage.setItem(CONVITES_KEY, JSON.stringify(c)); } catch (e) {}
  }
  function linkConvite(o, nome, token) {
    var qs = '?obra=' + encodeURIComponent(o.titulo || '') +
      (nome ? '&cliente=' + encodeURIComponent(nome) : '') +
      (token ? '&c=' + encodeURIComponent(token) : '');
    return SITE_BASE + '/pesquisa' + qs;
  }
  function mensagemConvite(o, nome, link) {
    var ola = nome ? 'Olá, ' + nome + '.' : 'Olá.';
    var obra = o.titulo ? ' sobre a obra “' + o.titulo + '”' : '';
    return ola + ' Preparei uma pequena pesquisa' + obra + ' — seis capítulos, cerca de cinco minutos. A sua opinião ajuda-me a melhorar o próximo trabalho.\n\n' + link;
  }

  function openInvite(id) {
    var o = S.data.obras.find(function (x) { return x.id === id; });
    if (!o) { toast('Obra não encontrada.', 'err'); return; }
    var token = slugify(o.id) + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    var root = $('#modalRoot');
    root.innerHTML =
      '<div class="overlay center" data-overlay>' +
        '<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="inviteTitle" style="width:min(560px,100%)">' +
          '<h3 id="inviteTitle">Convite de pesquisa</h3>' +
          '<p>“' + esc(o.titulo || 'Obra') + '” · personalize o nome do colecionador.</p>' +
          '<div class="field"><label class="f" for="inviteNome">Nome do cliente (opcional)</label><input type="text" id="inviteNome" placeholder="Ex.: Maria Silva" autocomplete="name"></div>' +
          '<div class="field"><label class="f" for="inviteLink">Ligação personalizada</label><input class="invite-link-field" type="text" id="inviteLink" readonly></div>' +
          '<div class="row" style="justify-content:flex-start;flex-wrap:wrap">' +
            '<button class="btn gold" data-invite-copy>Copiar link</button>' +
            '<button class="btn" data-invite-wa>WhatsApp</button>' +
            '<button class="btn" data-invite-mail>E-mail</button>' +
            '<button class="btn ghost" data-invite-open>Pré-visualizar</button>' +
          '</div>' +
          '<p class="hint" id="inviteStatus">O cliente vê a pesquisa com o nome e a obra já preenchidos.</p>' +
          '<div class="row" style="margin-top:1rem"><button class="btn ghost" data-cancel>Fechar</button></div>' +
        '</div>' +
      '</div>';

    var nomeInput = $('#inviteNome');
    var linkInput = $('#inviteLink');
    var status = $('#inviteStatus');
    function atualizar() {
      linkInput.value = linkConvite(o, nomeInput.value.trim(), token);
    }
    function copiar(texto, cb) {
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(texto).then(function () { cb(true); }, function () { cb(false); });
      } else {
        linkInput.select();
        var ok = false;
        try { ok = document.execCommand('copy'); } catch (e) {}
        cb(ok);
      }
    }
    function fechar() { root.innerHTML = ''; render(); }

    atualizar();
    nomeInput.addEventListener('input', atualizar);
    $('[data-cancel]').addEventListener('click', fechar);
    $('[data-overlay]').addEventListener('mousedown', function (e) { if (e.target === e.currentTarget) fechar(); });

    $('[data-invite-copy]').addEventListener('click', function () {
      copiar(linkInput.value, function (ok) {
        status.textContent = ok ? 'Link copiado. Envie ao colecionador pelo canal que preferir.' : 'Selecione o link e copie manualmente.';
        if (ok) { marcarConvite(o.id, nomeInput.value.trim()); toast('Link do convite copiado.', 'ok'); }
      });
    });
    $('[data-invite-wa]').addEventListener('click', function () {
      var nome = nomeInput.value.trim();
      var msg = mensagemConvite(o, nome, linkInput.value);
      marcarConvite(o.id, nome);
      window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank', 'noopener');
      status.textContent = 'WhatsApp aberto. Escolha o contacto e envie.';
    });
    $('[data-invite-mail]').addEventListener('click', function () {
      var nome = nomeInput.value.trim();
      var assunto = 'A sua opinião sobre “' + (o.titulo || 'a sua obra') + '” — Atelier Bruno Amaral';
      var msg = mensagemConvite(o, nome, linkInput.value);
      marcarConvite(o.id, nome);
      window.location.href = 'mailto:?subject=' + encodeURIComponent(assunto) + '&body=' + encodeURIComponent(msg);
      status.textContent = 'E-mail preparado no seu programa de correio.';
    });
    $('[data-invite-open]').addEventListener('click', function () {
      window.open(linkInput.value, '_blank', 'noopener');
    });
    setTimeout(function () { nomeInput.focus(); }, 40);
  }

  function loadPesquisas(forcar) {
    if (S.pesq.status === 'loading') return;
    if (!getPassword(false)) {
      S.pesq.status = 'auth';
      if (S.view === 'pesquisa') render();
      return;
    }
    S.pesq.status = 'loading';
    S.pesq.erro = '';
    if (S.view === 'pesquisa') render();

    apiGet('/api/pesquisa').then(function (j) {
      S.pesq.itens = Array.isArray(j.respostas) ? j.respostas : [];
      S.pesq.status = 'ready';
      S.pesq.atualizado = Date.now();
      var badge = $('#navPesq');
      if (badge) badge.textContent = S.pesq.itens.length || '';
      if (S.view === 'pesquisa') render();
      if (forcar) toast('Respostas atualizadas.', 'ok');
    }).catch(function (err) {
      S.pesq.status = err.code === 401 ? 'auth' : 'error';
      S.pesq.erro = err.message;
      if (S.view === 'pesquisa') render();
      if (forcar) toast(err.code === 401 ? 'Senha incorreta.' : 'Não foi possível carregar: ' + err.message, 'err');
    });
  }

  function entrarPesquisa() {
    askPassword().then(function (pw) {
      if (!pw) return;
      sessionStorage.setItem(PW_KEY, pw);
      S.pesq.status = 'idle';
      loadPesquisas(true);
    });
  }

  function removerResposta(id) {
    if (!id) { toast('Esta resposta não pode ser removida.', 'err'); return; }
    if (!confirm('Remover esta resposta? Esta ação não pode ser desfeita.')) return;
    apiDelete('/api/pesquisa?id=' + encodeURIComponent(id)).then(function () {
      S.pesq.itens = S.pesq.itens.filter(function (r) { return String(r.id) !== String(id); });
      delete S.pesq.open[id];
      var badge = $('#navPesq');
      if (badge) badge.textContent = S.pesq.itens.length || '';
      if (S.view === 'pesquisa') render();
      toast('Resposta removida.', 'ok');
    }).catch(function (err) {
      if (err.code === 401) { S.pesq.status = 'auth'; render(); }
      toast('Não foi possível remover: ' + err.message, 'err');
    });
  }

  // ------------------------------------------------------------------ publicar
  function diffSummary() {
    var pub = S.published || { obras: [] };
    var map = {};
    (pub.obras || []).forEach(function (o) { map[o.id] = JSON.stringify(o); });
    var novos = 0, alterados = 0;
    (S.data.obras || []).forEach(function (o) {
      if (!map[o.id]) novos++;
      else if (map[o.id] !== JSON.stringify(o)) alterados++;
      delete map[o.id];
    });
    var removidos = Object.keys(map).length;
    var textos = ['site', 'sobre', 'contato', 'footerDescricao', 'exposicoes', 'depoimentos'].filter(function (k) {
      return JSON.stringify(S.data[k]) !== JSON.stringify(pub[k]);
    }).length;
    return { novos: novos, alterados: alterados, removidos: removidos, textos: textos };
  }
  function diffRow(label, n, tone) {
    return '<div class="diff-row"><span>' + esc(label) + '</span><b style="color:' + (n ? (tone || 'var(--gold-dark)') : 'var(--ink-soft)') + '">' + n + '</b></div>';
  }
  function openPublish() {
    var d = diffSummary();
    var hasPw = !!getPassword(false);
    var root = $('#modalRoot');
    root.innerHTML =
      '<div class="overlay center" data-overlay>' +
        '<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="pubTitle">' +
          '<h3 id="pubTitle">Publicar no site</h3>' +
          '<p>As alterações vão para o ar em poucos segundos.</p>' +
          '<div class="diff">' +
            diffRow('Obras novas', d.novos) +
            diffRow('Obras alteradas', d.alterados) +
            diffRow('Obras removidas', d.removidos, 'var(--danger)') +
            diffRow('Seções de texto editadas', d.textos) +
          '</div>' +
          (hasPw
            ? '<p class="hint">Usando a senha desta sessão. <button class="btn sm ghost" data-forget-pw>trocar</button></p>'
            : '<div class="field"><label class="f">Senha do painel</label><input type="password" id="pubPw" placeholder="••••••••" autocomplete="current-password"></div>') +
          '<div class="progress" id="pubProg"><span></span></div>' +
          '<div class="row"><button class="btn ghost" data-cancel>Cancelar</button><button class="btn primary" id="pubGo">' +
            (isDirty() ? 'Publicar alterações' : 'Publicar') + '</button></div>' +
        '</div>' +
      '</div>';

    var goBtn = $('#pubGo');
    var pwInput = $('#pubPw');
    if (pwInput) setTimeout(function () { pwInput.focus(); }, 40);

    $('[data-cancel]').addEventListener('click', function () { root.innerHTML = ''; });
    var forget = $('[data-forget-pw]');
    if (forget) forget.addEventListener('click', function () { sessionStorage.removeItem(PW_KEY); openPublish(); });
    $('[data-overlay]').addEventListener('mousedown', function (e) { if (e.target === e.currentTarget) root.innerHTML = ''; });
    goBtn.addEventListener('click', submit);
    if (pwInput) pwInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });

    async function submit() {
      var pw = hasPw ? getPassword(false) : (pwInput ? pwInput.value : '');
      if (!pw) { toast('Informe a senha do painel.', 'err'); return; }
      sessionStorage.setItem(PW_KEY, pw);
      goBtn.disabled = true;
      $('#pubProg').classList.add('show');
      try {
        await api('/api/save', S.data);
        S.published = clone(S.data);
        S.lastPublish = new Date();
        S.undo = []; S.redo = [];
        localStorage.removeItem(DRAFT_KEY);
        localStorage.removeItem(LEGACY_DRAFT_KEY);
        root.innerHTML = '';
        updateChrome();
        toast('Publicado! O site já está atualizado.', 'ok');
        render();
      } catch (err) {
        goBtn.disabled = false;
        $('#pubProg').classList.remove('show');
        if (/Senha incorreta|401/.test(err.message)) {
          sessionStorage.removeItem(PW_KEY);
          toast('Senha incorreta.', 'err');
          openPublish();
        } else {
          toast('Não foi possível publicar: ' + err.message, 'err');
        }
      }
    }
  }

  function logout() {
    sessionStorage.removeItem(PW_KEY);
    toast('Senha removida desta sessão.');
  }

  function discard() {
    if (!confirm('Descartar as alterações locais e voltar ao conteúdo publicado?')) return;
    discardDraft();
  }

  // ------------------------------------------------------------------ backup
  function exportData() {
    var content = '/* ==========================================================================\n' +
      '   DATA.JS — Fonte única de dados do site Atelier Bruno Amaral\n' +
      '   Gerado pela Área do Artista em ' + new Date().toLocaleString('pt-BR') + '\n' +
      '   ========================================================================== */\n\n' +
      'window.SITE_DATA = ' + JSON.stringify(S.data, null, 2) + ';\n';
    var blob = new Blob([content], { type: 'text/javascript;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'data.js';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    toast('Backup data.js baixado.', 'ok');
  }

  function importData(file) {
    var reader = new FileReader();
    reader.onload = function (ev) {
      try {
        var fn = new Function('window', ev.target.result + '\nreturn window.SITE_DATA;');
        var imported = fn({});
        if (!imported || !Array.isArray(imported.obras)) throw new Error('Formato inválido: falta window.SITE_DATA com obras.');
        pushUndo();
        S.data = imported;
        changed(); persistDraft(); render();
        toast('data.js importado. Revise e publique.', 'ok');
      } catch (err) {
        toast('Falha ao importar: ' + err.message, 'err');
      }
    };
    reader.readAsText(file);
  }

  // ------------------------------------------------------------------ imagem
  function reduzirImagem(file) {
    return new Promise(function (resolve, reject) {
      if (!/^image\//.test(file.type)) return reject(new Error('Arquivo não é imagem'));
      var reader = new FileReader();
      reader.onerror = function () { reject(new Error('Falha ao ler o arquivo')); };
      reader.onload = function (ev) {
        var img = new Image();
        img.onerror = function () { reject(new Error('Imagem inválida')); };
        img.onload = function () {
          var max = 1600;
          var escala = Math.min(1, max / Math.max(img.width, img.height));
          var c = document.createElement('canvas');
          c.width = Math.max(1, Math.round(img.width * escala));
          c.height = Math.max(1, Math.round(img.height * escala));
          var ctx = c.getContext('2d');
          ctx.fillStyle = '#fff';
          ctx.fillRect(0, 0, c.width, c.height);
          ctx.drawImage(img, 0, 0, c.width, c.height);
          resolve(c.toDataURL('image/jpeg', 0.86));
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  // ------------------------------------------------------------------ init
  function init() {
    var base = window.SITE_DATA ? clone(window.SITE_DATA) : null;
    S.data = base ? clone(base) : { site: {}, sobre: {}, contato: {}, footerDescricao: '', exposicoes: [], depoimentos: [], obras: [] };
    S.published = base ? clone(base) : null;

    // rascunho local (v2) ou migração do v1
    var draft = localStorage.getItem(DRAFT_KEY) || localStorage.getItem(LEGACY_DRAFT_KEY);
    if (draft) {
      try {
        var d = JSON.parse(draft);
        if (d && Array.isArray(d.obras)) { S.data = d; S.restaurado = true; }
      } catch (e) {}
    }

    // busca o publicado (mais recente que o data.js)
    fetch('/api/data?t=' + Date.now(), { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('sem publicação');
      return r.json();
    }).then(function (pub) {
      if (!pub || !pub.obras || !pub.site) return;
      S.published = clone(pub);
      if (!S.restaurado) S.data = clone(pub);
      render();
    }).catch(function () { /* usa data.js local */ }).then(function () {
      render();
    });

    render();
    if (S.restaurado) toast('Rascunho local restaurado.');
  }

  // ------------------------------------------------------------------ eventos globais
  $('#importFile').addEventListener('change', function (e) {
    if (e.target.files[0]) importData(e.target.files[0]);
    e.target.value = '';
  });
  document.addEventListener('keydown', function (e) {
    var mod = e.ctrlKey || e.metaKey;
    var key = e.key.toLowerCase();
    if (mod && key === 's') { e.preventDefault(); openPublish(); }
    else if (mod && key === 'k') { e.preventDefault(); openPalette(); }
    else if (mod && e.shiftKey && key === 'z') {
      if (document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
      e.preventDefault(); redo();
    } else if (mod && key === 'z') {
      if (document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
      e.preventDefault(); undo();
    } else if ((e.key === 'Enter' || e.key === ' ') && document.activeElement && document.activeElement.matches('[data-resp-toggle]')) {
      e.preventDefault();
      document.activeElement.click();
    } else if (e.key === 'Escape') {
      var root = $('#modalRoot'); if (root) root.innerHTML = '';
    }
  });

  window.addEventListener('beforeunload', function (e) {
    if (isDirty()) { e.preventDefault(); e.returnValue = ''; return ''; }
  });

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
</body>
</html>
